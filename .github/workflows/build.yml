name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            task: packageDmg
            artifact: dmg
            path: build/compose/binaries/main/dmg
          - name: Windows
            os: windows-latest
            task: packageMsi
            artifact: msi
            path: build/compose/binaries/main/msi
          - name: Linux
            os: ubuntu-latest
            task: packageDeb
            artifact: deb
            path: build/compose/binaries/main/deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package
        run: ./gradlew ${{ matrix.task }}

      - name: Print jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/${{ matrix.task }}/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
