name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  build-macos-intel:
    name: Build macOS (Intel)
    needs: test
    runs-on: macos-15-intel # macOS 15 runs on Intel hardware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: x64  # Explicitly use Intel Java
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package for Intel Macs
        run: ./gradlew packageDmg -Porg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"

      - name: Rename Intel artifact
        run: |
          mkdir -p build/compose/binaries/intel
          cp build/compose/binaries/main/dmg/*.dmg build/compose/binaries/intel/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-dmg-intel
          path: build/compose/binaries/intel
          if-no-files-found: error

  build-macos-arm:
    name: Build macOS (Apple Silicon)
    needs: test
    runs-on: macos-latest  # Latest macOS runs on Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: arm64  # Explicitly use ARM Java
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package for Apple Silicon Macs
        run: ./gradlew packageDmg -Porg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8"

      - name: Rename ARM artifact
        run: |
          mkdir -p build/compose/binaries/arm
          cp build/compose/binaries/main/dmg/*.dmg build/compose/binaries/arm/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-dmg-arm
          path: build/compose/binaries/arm
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package
        run: ./gradlew packageMsi

      - name: Print jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/packageMsi/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-msi
          path: build/compose/binaries/main/msi
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package
        run: ./gradlew packageDeb

      - name: Print jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/packageDeb/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-deb
          path: build/compose/binaries/main/deb
          if-no-files-found: error

  release:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
