name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  build-macos-intel:
    name: Build macOS (Intel x86_64)
    needs: test
    runs-on: macos-26-intel  # Intel-based macOS runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: x64
      - uses: gradle/actions/setup-gradle@v4

      - name: Get version from tag or branch
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${GITHUB_REF#refs/heads/}-$(date +%Y%m%d-%H%M)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        shell: bash

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Build Intel DMG
        run: |
          echo "Building for Intel Macs (x86_64)..."
          ./gradlew packageDmg --no-daemon
        shell: bash

      - name: Verify DMG was created
        run: |
          echo "=== Checking DMG ==="
          ls -lh build/compose/binaries/main/dmg/
          file build/compose/binaries/main/dmg/*.dmg
          echo "=== Testing mount ==="
          hdiutil attach -verify -mountpoint /tmp/test-intel build/compose/binaries/main/dmg/*.dmg && hdiutil detach /tmp/test-intel || echo "Mount test completed"
        shell: bash

      - name: Prepare Intel artifact
        run: |
          mkdir -p output
          cp build/compose/binaries/main/dmg/*.dmg "output/Petrie-Image-Importer-${{ steps.version.outputs.version }}-Intel.dmg"
          echo "Intel build ready:"
          ls -lh output/
          file output/*.dmg
          hdiutil info output/*.dmg
        shell: bash

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Petrie-Image-Importer-${{ steps.version.outputs.version }}-Intel
          path: output/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-macos-arm:
    name: Build macOS (ARM arm64)
    needs: test
    runs-on: macos-26  # Apple Silicon-based macOS runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: arm64
      - uses: gradle/actions/setup-gradle@v4

      - name: Get version from tag or branch
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${GITHUB_REF#refs/heads/}-$(date +%Y%m%d-%H%M)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        shell: bash

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Build ARM DMG
        run: |
          echo "Building for Apple Silicon Macs (arm64)..."
          ./gradlew packageDmg --no-daemon
        shell: bash

      - name: Verify DMG was created
        run: |
          echo "=== Checking DMG ==="
          ls -lh build/compose/binaries/main/dmg/
          file build/compose/binaries/main/dmg/*.dmg
          echo "=== Testing mount ==="
          hdiutil attach -verify -mountpoint /tmp/test-arm build/compose/binaries/main/dmg/*.dmg && hdiutil detach /tmp/test-arm || echo "Mount test completed"
        shell: bash

      - name: Prepare ARM artifact
        run: |
          mkdir -p output
          cp build/compose/binaries/main/dmg/*.dmg "output/Petrie-Image-Importer-${{ steps.version.outputs.version }}-ARM.dmg"
          echo "ARM build ready:"
          ls -lh output/
          file output/*.dmg
          hdiutil info output/*.dmg
        shell: bash

      - name: Upload ARM DMG
        uses: actions/upload-artifact@v4
        with:
          name: Petrie-Image-Importer-${{ steps.version.outputs.version }}-ARM
          path: output/*.dmg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package
        run: ./gradlew packageMsi

      - name: Print jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/packageMsi/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-msi
          path: build/compose/binaries/main/msi
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Regenerate icons
        run: |
          rm -f src/main/resources/icon.png src/main/resources/icon.ico src/main/resources/icon.icns
          ./gradlew generateIcons
        shell: bash

      - name: Package
        run: ./gradlew packageDeb

      - name: Print jpackage logs on failure
        if: failure()
        run: |
          for f in build/compose/logs/packageDeb/*.txt; do
            echo "=== $f ==="
            cat "$f"
          done
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: installer-deb
          path: build/compose/binaries/main/deb
          if-no-files-found: error

  release:
    name: Upload Release Assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: |
          echo "=== Downloaded files ==="
          ls -lh artifacts/
          file artifacts/*
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
